<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search the web with a simple Google Search interface. A CS50 Web project.">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav aria-label="Search navigation">
            <a href="images.html">Images</a>
            <a href="advanced.html">Advanced Search</a>
            <a href="forms.html" lang="cs">Formuláře</a>
            <a href="https://vojtechbedan.github.io/">Portfolio</a>
        </nav>
    </header>

    <main class="search-main">
        <h1 class="wordmark" aria-label="Google"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span></h1>

        <form class="search-form" action="https://www.google.com/search" method="get" role="search">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
                <label class="visually-hidden" for="query">Search the web</label>
                <input id="query" type="text" name="q" autocomplete="off" spellcheck="false" required>
            </div>
            <div class="search-actions">
                <button type="submit">Google Search</button>
                <a class="search-button" href="https://doodles.google/">I'm Feeling Lucky</a>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <span>CS50 Web · Search</span>
        <a href="https://cs50.harvard.edu/web/projects/0/search/">About this project</a>
        <a href="https://github.com/VojtechBedan/googlesearch/blob/main/citace.md" lang="cs">Citace a zdroje</a>
        <nav class="validation-links" aria-label="Page validation">
            <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fvojtechbedan.github.io%2Fgooglesearch%2F" target="_blank" rel="noopener noreferrer" aria-label="Validate this page's HTML (opens in a new tab)">HTML validator ↗</a>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fvojtechbedan.github.io%2Fgooglesearch%2Fimages.html&profile=css3svg&usermedium=all&warning=1&lang=cs&amp;profile=css3svg&amp;usermedium=all&amp;warning=1&amp;lang=cs" target="_blank" rel="noopener noreferrer" aria-label="Validate this page's CSS (opens in a new tab)">CSS validator ↗</a>
        </nav>
    </footer>
</body>
</html>
